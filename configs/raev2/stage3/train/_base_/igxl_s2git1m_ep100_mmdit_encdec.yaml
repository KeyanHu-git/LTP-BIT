_base_:
  - ../../base.yaml
  - ../../../_base_/models/stage3_controlled_ditdh_ig_xl_dinov3l_k7_256.yaml
  - ../../../_base_/codecs/dinov3l_k7_imagenet.yaml

stage_1:
  params:
    pretrained_decoder_path: weights/stage1/ltp_bit_codec_ep19/decoder_ema.pt

stage3:
  data_mix:
    paired_ratio: 1.0
    prior_ratio: 0.0
    source_dropout_ratio: 0.0
  control:
    type: mmdit_lite_encdec
    target: raev2.stage3.controls.mmdit_lite.MMDiTLiteEncDecControl
    params:
      mmdit_stream_width: 360
      mmdit_stream_heads: 5
      mmdit_dual_blocks: 14
      mmdit_gate_init: -4.0
      mmdit_gate_scale: 50.0
      mmdit_use_source_time: true
      mmdit_use_source_context: true
      mmdit_blocks_per_ref: 1
      mmdit_gate_per_block: false
      mmdit_block_stride: 2
      dec_stream_width: 512
      dec_stream_heads: 4
      dec_gate_init: -4.0
      dec_gate_scale: 50.0
    init:
      type: trunk_headcopy
      seed: 42
      enc_positions: [0, 1, 2, 3, 4]
      dec_positions: [0, 1, 2, 3]
  loss:
    base_model_coeff: 0.0
    time_sampling:
      pure_noise_prob: 0.25
      pure_noise_t: 1.0
      pure_noise_start_prob: 1.0
      pure_noise_hold_frac: 0.125
      pure_noise_decay_end_epoch: 20
  freeze:
    base_model: true
    trainable:
      - "^condition_control\\."
      - "\\.lora_[AB]$"
    frozen: []
    assert_trainable_nonzero: true
    trainable_allowlist:
      - "^condition_control\\."
      - "\\.lora_[AB]$"
  checkpoint:
    strict_init: false
    allowed_missing_prefixes:
      - "condition_control."
    save_mode: adapter

misc:
  num_classes: 9
  null_label: 9

lora:
  rank: 0
  alpha: 0
  encoder_rank: 128
  encoder_alpha: 128
  decoder_rank: 256
  decoder_alpha: 256
  target_substrings: ["attn.q", "attn.k", "attn.v", "attn.proj"]

training:
  epochs: 80
  global_seed: 42
  global_batch_size: 256
  grad_accum_steps: 2
  precision: bf16
  num_workers: 4
  log_interval: 25
  checkpoint_interval: 10
  checkpoint_policy:
    interval_epochs: 10
    save_numbered: true
    save_last_every_epoch: false
  clip_grad: 0.3
  ema_decay: 0.999
  compile: false
  allow_cold_start: false
  init_ckpt: weights/stage2/igxl_git1m_ep100.pt
  optimizer:
    type: adamw
    lr: 5.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: cosine
    warmup_epochs: 2
    warmup_from_zero: true
    decay_start_epoch: 2
    decay_end_epoch: 80
    base_lr: 5.0e-4
    final_lr: 0.0

eval:
  enabled: true
  epoch_interval: 10
  num_samples: 256
  gen_batch_size: 16
  split: test
  preview_max_images: 16
