# RAEv2 ImageNet class-conditional Stage-2 backbone.
# RAEv2 IG-XL latent prior.

stage_2:
  target: raev2.stage2.models.DDT.DiTwDDTHeadIG
  params:
    input_size: 16
    patch_size: [1, 1]
    in_channels: 1024
    hidden_size: [1440, 2048]
    depth: [28, 2]
    num_heads: [20, 16]
    mlp_ratio: 4.0
    base_model_depth: 8

conditioning:
  type: label
  cfg_dropout_prob: 0.1
  arch:
    num_t_tokens: 4
    num_c_tokens: 8
