# RAEv2 Stage 2 base: class-conditional latent diffusion.

transport:
  prediction: x
  time_dist_type: logit-normal_0_1
  t_eps: 0.05

sampler:
  num_steps: 50

conditioning:
  type: label
  cfg_dropout_prob: 0.1
  context_dim: null
  arch:
    num_t_tokens: 4
    num_c_tokens: 8
    num_cfg_omega_tokens: 4

guidance:
  cfg:
    scale: 1.0
    t_min: 0.0
    t_max: 1.0
  ig:
    scale: 1.35
    t_min: 0.10
    t_max: 1.0

repa:
  use_repa: false
  repa_layer_depth: 8
  repa_coeff: 0.5
  target_encoder: dinov2-vit-b
  target_encoder_resolution: 256
  z_dim: null

internal_guidance:
  base_model_depth: null
  base_model_coeff: 1.0

training:
  epochs: 80
  global_batch_size: 1024
  grad_accum_steps: 1
  ema_decay: 0.9995
  num_workers: 4
  log_interval: 100
  checkpoint_interval: 1
  sample_every: 5000
  clip_grad: 1.0
  global_seed: 42
  precision: bf16
  compile: true
  optimizer:
    type: gmuon
    lr: 2.0e-4
    momentum: 0.95
    nesterov: true
    ns_coefficients_preset: POLAR_EXPRESS_COEFFICIENTS
    ns_use_kernels: false
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 25
    decay_end_epoch: 50
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_from_zero: false
  image_size: 256

eval:
  enabled: false
  eval_interval: 5000
  eval_model: false
  eval_dir: results/stage2/eval

misc:
  latent_size: [1024, 16, 16]
  num_classes: 1000
  null_label: 1000
  time_dist_shift_dim: 262144
  time_dist_shift_base: 4096
