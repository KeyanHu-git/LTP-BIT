_base_:
  - ../_base_/runtime/default_dataloader.yaml

real_set:
  name: qxslab_saropt_test_opt
  image_dir: dataset/QXSLAB_SAROPT/test/opt
  preprocess:
    - {type: ToTensor, keys: [pred]}
  batch_size: 64
  num_workers: 4
  auto_resume: true

eval_dataset:
  type: EvalPairedDataset
  pred_dir: null
  gt_dir: dataset/QXSLAB_SAROPT/test/opt
  preprocess:
    - {type: ToTensor, keys: [pred, gt]}

metrics:
  - {type: PSNR, data_range: 1.0}
  - {type: GlobalPSNR, data_range: 1.0}
  - {type: SSIM, data_range: 1.0}
  - type: FID
    feature: 2048
    normalize: true
    feature_extractor_weights_path: weights/evaluation/inception/weights-inception-2015-12-05-6726825d.pth
  - type: CMMD
    model_path: weights/evaluation/clip-vit-large-patch14-336
    sigma: 10.0
    scale: 1000.0
  - {type: LPIPS, net_type: alex, normalize: true}

eval:
  enabled: false
  epoch_interval: 10
  num_samples: 256
  gen_batch_size: 8
  split: test
  save_dir: sample
  preview_dir: sample_preview
  preview_max_images: 16
  fail_on_error: true
